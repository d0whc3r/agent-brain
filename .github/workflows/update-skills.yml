name: Update third-party skills

on:
  schedule:
    # Monday 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-skills
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up pnpm
        # A third-party action runs with write access, so pin it to a commit.
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Install dependencies
        # bin/brain.mjs imports yaml.
        run: pnpm install --frozen-lockfile

      - name: Update project skills
        run: node bin/brain.mjs skills update --apply

      - name: Confirm every catalog skill is present
        run: node bin/brain.mjs skills check

      - name: Open a pull request when skills change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add -- .agents/skills skills-lock.json
          if git diff --cached --quiet; then
            echo "No skill updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="bot/update-skills"
          git checkout -B "$branch"
          git commit -m "chore: update third-party skills"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git push --force-with-lease origin "$branch"
          else
            git push -u origin "$branch"
          fi
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "Pull request for $branch already exists."
            exit 0
          fi
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "chore: update third-party skills" \
            --body "This pull request refreshes the copies in .agents/skills from the sources in skills/third-party.json. Review the diff before you merge."
